<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SecureNet Lab live network security monitoring dashboard">
<title>SecureNet Lab - Live Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"
        integrity="sha384-G436+Z2nlA8+PNoeRvWdxKbvOf8E/y+lYxqht2iBwNHTQDV5CJr3+AGVj8fGZi5t"
        crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --red: #f85149;
    --orange: #d29922;
    --green: #3fb950;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 600; }
  h1 span { color: var(--accent); }
  #status { color: var(--muted); font-size: 13px; }
  #status.live::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 50% { opacity: .4; } }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .card .num { font-size: 32px; font-weight: 700; }
  .card .lbl { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 24px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .panel h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 12px; text-transform: uppercase; letter-spacing: .5px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  .sev { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .sev-critical { background: rgba(248,81,73,.15); color: var(--red); }
  .sev-high { background: rgba(210,153,34,.15); color: var(--orange); }
  .sev-medium { background: rgba(88,166,255,.15); color: var(--accent); }
  .sev-low { background: rgba(63,185,80,.15); color: var(--green); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .chart-wrap { position: relative; height: 220px; }
  .no-chart { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>SecureNet <span>Lab</span></h1>
  <div id="status">connecting...</div>
</header>

<div class="cards">
  <div class="card"><div class="num" id="c-events">-</div><div class="lbl">Total events</div></div>
  <div class="card"><div class="num" id="c-bans">-</div><div class="lbl">Active bans</div></div>
  <div class="card"><div class="num" id="c-ips">-</div><div class="lbl">Unique attackers</div></div>
  <div class="card"><div class="num" id="c-last">-</div><div class="lbl">Last event</div></div>
</div>

<div class="grid">
  <div class="panel">
    <h2>Events per day (14d)</h2>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>
  <div class="panel">
    <h2>Top attackers</h2>
    <table>
      <thead><tr><th>IP</th><th>Events</th></tr></thead>
      <tbody id="top-body"></tbody>
    </table>
  </div>
</div>

<div class="grid" style="grid-template-columns: 3fr 2fr;">
  <div class="panel">
    <h2>Recent events</h2>
    <table>
      <thead><tr><th>Time</th><th>Source IP</th><th>Type</th><th>Severity</th></tr></thead>
      <tbody id="events-body"></tbody>
    </table>
  </div>
  <div class="panel">
    <h2>Active bans</h2>
    <table>
      <thead><tr><th>IP</th><th>Reason</th><th>Banned at</th></tr></thead>
      <tbody id="bans-body"></tbody>
    </table>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let chart = null;
let chartFallback = false;

// Every API value is escaped before it touches innerHTML: event data
// originates from attackers (paths, user agents, usernames).
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ESC[c]);
}

function fmtTime(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + " -> " + r.status);
  return r.json();
}

async function refresh() {
  try {
    const [stats, events, bans, series, top] = await Promise.all([
      fetchJSON("/api/stats"),
      fetchJSON("/api/events?limit=15"),
      fetchJSON("/api/bans"),
      fetchJSON("/api/timeseries?days=14"),
      fetchJSON("/api/top-attackers?limit=8"),
    ]);

    $("c-events").textContent = stats.total_events;
    $("c-bans").textContent = stats.active_bans;
    $("c-ips").textContent = stats.unique_attackers;
    $("c-last").textContent = fmtTime(stats.last_event_at);

    $("events-body").innerHTML = events.map(e =>
      `<tr><td class="mono">${esc(fmtTime(e.timestamp))}</td>
       <td class="mono">${esc(e.source_ip)}</td>
       <td>${esc(e.event_type)}</td>
       <td><span class="sev sev-${esc(e.severity)}">${esc(e.severity)}</span></td></tr>`
    ).join("") || `<tr><td colspan="4" style="color:var(--muted)">no events yet</td></tr>`;

    $("bans-body").innerHTML = bans.map(b =>
      `<tr><td class="mono">${esc(b.ip)}</td><td>${esc(b.reason || "-")}</td><td class="mono">${esc(fmtTime(b.banned_at))}</td></tr>`
    ).join("") || `<tr><td colspan="3" style="color:var(--muted)">no active bans</td></tr>`;

    $("top-body").innerHTML = top.map(t =>
      `<tr><td class="mono">${esc(t.ip)}</td><td>${esc(t.count)}</td></tr>`
    ).join("") || `<tr><td colspan="2" style="color:var(--muted)">no data</td></tr>`;

    if (window.Chart) {
      const labels = series.map(s => s.day.slice(5));
      const data = series.map(s => s.count);
      if (chart) {
        chart.data.labels = labels;
        chart.data.datasets[0].data = data;
        chart.update();
      } else {
        chart = new Chart($("chart"), {
          type: "bar",
          data: { labels, datasets: [{ label: "events", data, backgroundColor: "#58a6ff", borderRadius: 4 }] },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: "#8b949e" }, grid: { display: false } },
              y: { ticks: { color: "#8b949e", precision: 0 }, grid: { color: "#21262d" } },
            },
          },
        });
      }
    } else if (!chartFallback) {
      chartFallback = true;
      $("chart").replaceWith(Object.assign(document.createElement("div"),
        { className: "no-chart", textContent: "chart unavailable (no internet for CDN); " + series.reduce((a, s) => a + s.count, 0) + " events in 14d" }));
    }

    const st = $("status");
    st.textContent = "live - updated " + new Date().toLocaleTimeString();
    st.className = "live";
  } catch (err) {
    const st = $("status");
    st.textContent = "connection lost - retrying";
    st.className = "";
    console.error(err);
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
